name: Build Windows
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  export:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Export Windows
        run: mkdir -p build/windows && godot --headless --export-release "Windows Desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: PirateIsles-Windows
          path: build/windows/PirateIsles.exe
